name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check scripts tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # gemmi is needed by run_ipdae.py, which tests/test_benchmark.py imports.
      # It was missing, so the ipDAE tests failed in CI while passing locally for
      # anyone who happened to have it installed.
      - run: pip install numpy scikit-learn rdkit gemmi pytest
      - run: pytest -q
