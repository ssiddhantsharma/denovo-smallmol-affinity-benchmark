name: weekly

# The Monday chain, end to end:
#
#   1. watch     new papers -> one ranked issue, and the best candidate   (free)
#   2. ingest    extract + verify that candidate -> a PULL REQUEST        (tokens)
#   3. YOU       review and merge it                      (qc.yml gates the PR)
#   4. score     collect last week's runs, submit new rows        (credits)
#   5. figures   predictions change -> redraw + restamp     (figures.yml)
#
# Step 3 is the gate and it stays. Step 2 runs a model over a paper, but it can
# only open a PR -- append_paper.py is still the only writer of reference/, and
# nothing a model produced reaches main without a person merging it. A wrong row
# is worse than a missing one, because nobody can tell which rows to distrust.
#
# Step 4 spends, bounded by max_systems here and by BUDGET_CREDITS in the
# script, a ceiling on cumulative charge and the only thing that bounds repeated
# runs. Dispatch with score=false to watch without scoring.
#
# Collect comes BEFORE submit on purpose: a Rowan workflow finishes server-side
# minutes to hours after submission, so the run that submits cannot also collect
# it. Today's collect turns last week's submissions into predictions, and that
# push is what triggers figures.yml. Without it the loop submits forever and
# never produces a number.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      score:
        description: 'collect finished runs and submit new ones (SPENDS CREDITS)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write   # ingest opens one; a job cannot exceed the workflow

jobs:
  watch:
    uses: ./.github/workflows/watch-sources.yml
    permissions:
      contents: write
      issues: write

  # Only when the watcher found something that looks in scope (rank >= 2).
  # Opens a PR; it cannot reach main. Skips silently without ANTHROPIC_API_KEY.
  ingest:
    needs: watch
    if: needs.watch.outputs.top_doi != ''
    uses: ./.github/workflows/ingest.yml
    with:
      doi: ${{ needs.watch.outputs.top_doi }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  score:
    # Runs on the schedule. `inputs.score` is unset on a cron, so the test is
    # written to treat "not explicitly false" as yes -- `== true` would have
    # excluded the schedule, which is how this job sat dormant before.
    needs: watch
    if: inputs.score != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rowan-python

      # Picks up whatever last week submitted and writes the prediction CSVs.
      # Safe when nothing is outstanding: it writes no file and commits nothing.
      - name: collect finished runs
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
        run: python scripts/run_rowan_cofold.py --collect

      - name: is anything unscored?
        id: gap
        run: |
          # --count prints the bare number. This used to grep the prose line,
          # and renaming the column to rowan-<model>-* made the grep match
          # nothing, read zero, and skip the submit silently -- a parse failure
          # and "nothing to do" looked identical.
          python scripts/run_rowan_cofold.py          # the readable plan, for the log
          n=$(python scripts/run_rowan_cofold.py --count)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "unscored systems: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: submit
        if: steps.gap.outputs.n != '0'
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
        run: |
          if [ -z "$ROWAN_API_KEY" ]; then
            echo "::error::ROWAN_API_KEY is not set; skipping rather than failing the chain"
            exit 1
          fi
          # Reached only from a dispatch with score=true -- the job's `if`
          # excludes the cron, where inputs is unset. ~5 systems x ~9.2 = ~46
          # credits, bounded three ways: these two caps per run, and
          # BUDGET_CREDITS in the script, a ceiling on cumulative charge across
          # every run. Raise the batch by dispatching rowan.yml, not here.
          python scripts/run_rowan_cofold.py --submit \
            --max-credits 50 --max-systems 5

      # predictions/ too: the collect above may have written new columns, and
      # pushing them is what triggers figures.yml to redraw. Not gated on the
      # gap -- a run that submits nothing can still have collected something.
      - name: commit ids and any predictions
        run: |
          git diff --quiet -- reference/rowan_cofold_workflows.json predictions/ && {
            echo "nothing collected or submitted"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/rowan_cofold_workflows.json predictions/
          git commit -m "weekly: collect finished runs, submit new ones"
          git push
