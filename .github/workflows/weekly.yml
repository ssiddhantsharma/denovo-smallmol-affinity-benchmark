name: weekly

# The Monday chain: look for new papers, and score anything already ingested.
#
# What it does NOT do, deliberately: ingest a paper by itself. Extraction is an
# LLM reading a PDF, and the one property that makes this benchmark worth
# citing is that no model has ever written reference/. A wrong row is worse
# than a missing one, because nobody can tell which rows to distrust. So the
# chain stops at a reviewable step and a human merges.
#
#   1. watch     new papers -> one issue, ranked        (this job, free)
#   2. YOU       run the add-smallmol-paper skill, open a PR  (qc.yml gates it)
#   3. score     merged rows with no predictions -> Rowan     (needs the secret)
#   4. figures   predictions change -> redraw                 (figures.yml)
#
# Step 3 runs here only when rows are already merged and unscored, so the spend
# follows a human merge rather than an LLM's reading of an abstract.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      score:
        description: 'also submit unscored rows to Rowan (SPENDS CREDITS)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    uses: ./.github/workflows/watch-sources.yml
    permissions:
      contents: write
      issues: write

  score:
    # Only when asked, and only if something is actually unscored. A scheduled
    # run never spends on its own: inputs.score is unset on a schedule, so this
    # is skipped.
    needs: watch
    if: inputs.score == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rowan-python

      - name: is anything unscored?
        id: gap
        run: |
          # --count prints the bare number. This used to grep the prose line,
          # and renaming the column to rowan-<model>-* made the grep match
          # nothing, read zero, and skip the submit silently -- a parse failure
          # and "nothing to do" looked identical.
          python scripts/run_rowan_cofold.py          # the readable plan, for the log
          n=$(python scripts/run_rowan_cofold.py --count)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "unscored systems: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: submit
        if: steps.gap.outputs.n != '0'
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
        run: |
          if [ -z "$ROWAN_API_KEY" ]; then
            echo "::error::ROWAN_API_KEY is not set; skipping rather than failing the chain"
            exit 1
          fi
          # Reached only from a dispatch with score=true -- the job's `if`
          # excludes the cron, where inputs is unset. ~5 systems x ~9.2 = ~46
          # credits, bounded three ways: these two caps per run, and
          # BUDGET_CREDITS in the script, a ceiling on cumulative charge across
          # every run. Raise the batch by dispatching rowan.yml, not here.
          python scripts/run_rowan_cofold.py --submit \
            --max-credits 50 --max-systems 5

      - name: commit workflow ids
        if: steps.gap.outputs.n != '0'
        run: |
          git diff --quiet -- reference/rowan_cofold_workflows.json && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/rowan_cofold_workflows.json
          git commit -m "weekly: submitted new rows to Rowan"
          git push
          echo "Collect them with: gh workflow run rowan -f action=collect" >> "$GITHUB_STEP_SUMMARY"
